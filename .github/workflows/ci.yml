name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "scripts/**"
      - "flake.nix"
      - "flake.lock"
      - ".envrc"
      - ".nvim.lua"
      - ".config/about.toml"
      - ".config/about.hbs"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "scripts/**"
      - "flake.nix"
      - "flake.lock"
      - ".envrc"
      - ".nvim.lua"
      - ".config/about.toml"
      - ".config/about.hbs"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features -- -D warnings

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command-arguments: --config .config/deny.toml

  reuse:
    name: REUSE Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: fsfe/reuse-action@v6

  build-and-test:
    name: Build & Test (${{ matrix.name }})
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cargo: cargo
            run-on-pr: true
            upload-for-integration: true
          - name: Linux aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cargo: cross
            run-on-pr: false
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
            cargo: cargo
            run-on-pr: false
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cargo: cargo
            run-on-pr: false
    runs-on: ${{ matrix.os }}
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    steps:
      - name: Check if should run
        id: check
        if: ${{ matrix.run-on-pr || github.event_name == 'push' }}
        shell: bash
        run: echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6.0.2
        if: steps.check.outputs.run == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.run == 'true'

      - name: Add Rust target
        if: steps.check.outputs.run == 'true'
        run: rustup target add ${{ matrix.target }}

      - name: Install musl-tools
        if: steps.check.outputs.run == 'true' && matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: steps.check.outputs.run == 'true' && matrix.cargo == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5

      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.run == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.target }}

      - name: Build release
        if: steps.check.outputs.run == 'true'
        run: ${{ matrix.cargo }} build --release --target ${{ matrix.target }}

      - name: Verify static linking
        if: steps.check.outputs.run == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/mockserver"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "Checking binary type..."
            file "$BINARY"
            file "$BINARY" | grep -qE "statically linked|static-pie linked" || { echo "::error::Binary is not fully static"; exit 1; }
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "Checking dynamic dependencies..."
            otool -L "$BINARY"
            otool -L "$BINARY" | grep -qiE "(sqlite|lua)" && { echo "::error::SQLite or Lua dynamically linked"; exit 1; }
          fi
          echo "Static linking verified!"

      - name: Run tests
        if: steps.check.outputs.run == 'true'
        run: ${{ matrix.cargo }} test --all-features --target ${{ matrix.target }}

      - name: Upload binary for integration tests
        if: steps.check.outputs.run == 'true' && matrix.upload-for-integration
        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-test-binary
          path: target/${{ matrix.target }}/release/mockserver
          retention-days: 1

  integration-test:
    name: Integration Tests
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/download-artifact@v8.0.1
        with:
          name: integration-test-binary
          path: target/release/
      - run: chmod +x target/release/mockserver
      - uses: astral-sh/setup-uv@v7
      - name: Run integration tests
        env:
          MOCKSERVER_BIN: target/release/mockserver
        run: uv run --locked pytest tests/integration -v --timeout=120
