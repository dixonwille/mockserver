name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "scripts/**"
      - "flake.nix"
      - "flake.lock"
      - ".envrc"
      - ".nvim.lua"
      - ".config/about.toml"
      - ".config/about.hbs"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "scripts/**"
      - "flake.nix"
      - "flake.lock"
      - ".envrc"
      - ".nvim.lua"
      - ".config/about.toml"
      - ".config/about.hbs"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features -- -D warnings

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command-arguments: --config .config/deny.toml

  reuse:
    name: REUSE Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: fsfe/reuse-action@v5

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            run-on-pr: true
          - os: macos-latest
            run-on-pr: false
          - os: windows-latest
            run-on-pr: false
    runs-on: ${{ matrix.os }}
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    steps:
      - name: Check if should run
        id: check
        if: ${{ matrix.run-on-pr || github.event_name == 'push' }}
        run: echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.check.outputs.run == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.run == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release
        if: steps.check.outputs.run == 'true'
        run: cargo build --release

      - name: Verify static linking (Linux)
        if: steps.check.outputs.run == 'true' && runner.os == 'Linux'
        run: |
          echo "Checking dynamic dependencies..."
          ldd target/release/mockserver
          echo "Verifying SQLite and Lua are NOT dynamically linked..."
          ! ldd target/release/mockserver | grep -qiE "(sqlite|lua)" || exit 1
          echo "Static linking verified!"

      - name: Verify static linking (macOS)
        if: steps.check.outputs.run == 'true' && runner.os == 'macOS'
        run: |
          echo "Checking dynamic dependencies..."
          otool -L target/release/mockserver
          echo "Verifying SQLite and Lua are NOT dynamically linked..."
          ! otool -L target/release/mockserver | grep -qiE "(sqlite|lua)" || exit 1
          echo "Static linking verified!"

      - name: Run tests
        if: steps.check.outputs.run == 'true'
        run: cargo test --all-features

      - name: Upload binary for integration tests
        if: steps.check.outputs.run == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-binary
          path: target/release/mockserver
          retention-days: 1

  integration-test:
    name: Integration Tests
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: integration-test-binary
          path: target/release/
      - run: chmod +x target/release/mockserver
      - uses: astral-sh/setup-uv@v7
      - name: Run integration tests
        env:
          MOCKSERVER_BIN: target/release/mockserver
        run: uv run --locked pytest tests/integration -v --timeout=120
