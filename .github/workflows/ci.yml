name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "scripts/**"
      - "flake.nix"
      - "flake.lock"
      - ".envrc"
      - ".nvim.lua"
      - ".config/about.toml"
      - ".config/about.hbs"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "scripts/**"
      - "flake.nix"
      - "flake.lock"
      - ".envrc"
      - ".nvim.lua"
      - ".config/about.toml"
      - ".config/about.hbs"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features -- -D warnings

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command-arguments: --config .config/deny.toml

  reuse:
    name: REUSE Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: fsfe/reuse-action@v6

  build-and-test:
    name: Build & Test (${{ matrix.name }})
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            run-on-pr: true
          - name: Linux aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
            run-on-pr: false
          - name: macOS
            os: macos-latest
            run-on-pr: false
          - name: Windows
            os: windows-latest
            run-on-pr: false
    runs-on: ${{ matrix.os }}
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    steps:
      - name: Check if should run
        id: check
        if: ${{ matrix.run-on-pr || github.event_name == 'push' }}
        shell: bash
        run: echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.check.outputs.run == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.run == 'true'

      - name: Add Rust target
        if: steps.check.outputs.run == 'true' && matrix.target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl-tools
        if: steps.check.outputs.run == 'true' && matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: steps.check.outputs.run == 'true' && matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5

      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.run == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.target || 'native' }}

      - name: Build release
        if: steps.check.outputs.run == 'true' && !matrix.cross
        run: cargo build --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Build release (cross)
        if: steps.check.outputs.run == 'true' && matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Verify static linking (Linux)
        if: steps.check.outputs.run == 'true' && runner.os == 'Linux' && !matrix.cross
        run: |
          BINARY="target/${{ matrix.target }}/release/mockserver"
          echo "Checking dynamic dependencies..."
          if ldd "$BINARY" 2>&1 | grep -q "not a dynamic executable\|statically linked"; then
            echo "Binary is fully static!"
          else
            ldd "$BINARY"
            echo "::error::Binary is not fully static"
            exit 1
          fi

      - name: Verify static linking (macOS)
        if: steps.check.outputs.run == 'true' && runner.os == 'macOS'
        run: |
          echo "Checking dynamic dependencies..."
          otool -L target/release/mockserver
          echo "Verifying SQLite and Lua are NOT dynamically linked..."
          ! otool -L target/release/mockserver | grep -qiE "(sqlite|lua)" || exit 1
          echo "Static linking verified!"

      - name: Run tests
        if: steps.check.outputs.run == 'true' && !matrix.cross
        run: cargo test --all-features ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Upload binary for integration tests
        if: steps.check.outputs.run == 'true' && matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-binary
          path: target/${{ matrix.target }}/release/mockserver
          retention-days: 1

  integration-test:
    name: Integration Tests
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: integration-test-binary
          path: target/release/
      - run: chmod +x target/release/mockserver
      - uses: astral-sh/setup-uv@v7
      - name: Run integration tests
        env:
          MOCKSERVER_BIN: target/release/mockserver
        run: uv run --locked pytest tests/integration -v --timeout=120
