name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

concurrency:
  group: release

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Validate Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${{ steps.version.outputs.version }}"
          # Handle pre-release versions (e.g., 1.0.0-rc1 should match tag v1.0.0-rc1)
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Cargo.toml has '$CARGO_VERSION' but tag is 'v$TAG_VERSION'"
            exit 1
          fi
          echo "Version validated: $CARGO_VERSION"

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cargo: cargo
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cargo: cross
          - target: x86_64-apple-darwin
            os: macos-latest
            cargo: cargo
          - target: aarch64-apple-darwin
            os: macos-latest
            cargo: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cargo: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - run: rustup target add ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cargo == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5

      - name: Build
        run: ${{ matrix.cargo }} build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/mockserver artifacts/
          echo "${{ matrix.target }}" > artifacts/target.txt

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item target/${{ matrix.target }}/release/mockserver.exe artifacts/
          Set-Content -Path artifacts/target.txt -Value "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: binary-${{ matrix.target }}
          path: artifacts/
          retention-days: 1

  licenses:
    name: Generate Licenses
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.8.4

      - name: Generate license files
        run: |
          cp LICENSES/AGPL-3.0-only.txt LICENSE
          cargo about generate -c .config/about.toml .config/about.hbs > THIRD_PARTY_LICENSES

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: licenses
          path: |
            LICENSE
            THIRD_PARTY_LICENSES
          retention-days: 1

  release:
    name: Create Release
    needs: [validate, build, licenses]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Download license files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: licenses

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: binary-*

      - name: Package releases
        run: |
          RELEASE_DIR="$(pwd)/release"
          mkdir -p "$RELEASE_DIR"
          VERSION="${{ needs.validate.outputs.version }}"

          for dir in artifacts/binary-*; do
            TARGET=$(tr -d '\r\n' < "$dir/target.txt")
            echo "Packaging $TARGET..."

            # Copy license files to artifact directory
            cp LICENSE "$dir/"
            cp THIRD_PARTY_LICENSES "$dir/"

            if [[ "$TARGET" == *"windows"* ]]; then
              # Windows: create zip
              ARCHIVE="mockserver-${VERSION}-${TARGET}.zip"
              (cd "$dir" && zip -j "$RELEASE_DIR/$ARCHIVE" mockserver.exe LICENSE THIRD_PARTY_LICENSES)
            else
              # Unix: create tar.gz
              ARCHIVE="mockserver-${VERSION}-${TARGET}.tar.gz"
              tar -czvf "$RELEASE_DIR/$ARCHIVE" -C "$dir" mockserver LICENSE THIRD_PARTY_LICENSES
            fi
          done

          # Generate SHA256SUMS
          (cd "$RELEASE_DIR" && sha256sum * > SHA256SUMS.txt)
          echo "Generated SHA256SUMS.txt:"
          cat "$RELEASE_DIR/SHA256SUMS.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: v${{ needs.validate.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS.txt

  container:
    name: Build Container
    needs: [validate, build, licenses]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Download license files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: licenses

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: binary-*-linux-*

      - name: Prepare binaries for container build
        run: |
          mkdir -p binaries/amd64 binaries/arm64

          # Copy x86_64 binary
          cp artifacts/binary-x86_64-unknown-linux-musl/mockserver binaries/amd64/
          chmod +x binaries/amd64/mockserver

          # Copy aarch64 binary
          cp artifacts/binary-aarch64-unknown-linux-musl/mockserver binaries/arm64/
          chmod +x binaries/arm64/mockserver

          echo "Prepared binaries:"
          ls -la binaries/*/

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1.7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch container
        id: build
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
        with:
          image: mockserver
          tags: >-
            ${{ needs.validate.outputs.version }}
            ${{ !contains(needs.validate.outputs.version, '-') && 'latest' || '' }}
          platforms: linux/amd64, linux/arm64
          containerfiles: ./Containerfile
          context: .

      - name: Push to GitHub Container Registry
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2.8
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
