version = 1
SPDX-PackageName = "mockserver"
SPDX-PackageSupplier = "mockserver contributors"
SPDX-PackageDownloadLocation = "https://github.com/wdixon/mockserver"

# Core mockserver code - AGPL-3.0-only
[[annotations]]
path = "Cargo.toml"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 mockserver contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# Generated templates for users - CC0-1.0 (public domain)
[[annotations]]
path = ["src/templates/**", "examples/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 mockserver contributors"
SPDX-License-Identifier = "CC0-1.0"

# Documentation - CC-BY-4.0
[[annotations]]
path = ["**.md", "docs/**.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 mockserver contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Lock files - CC0-1.0 (machine-generated)
[[annotations]]
path = ["Cargo.lock", "flake.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 mockserver contributors"
SPDX-License-Identifier = "CC0-1.0"

# Auxiliary/infrastructure files - MIT
[[annotations]]
path = [".envrc", ".gitignore", ".nvim.lua", ".python-version", "flake.nix", "rust-toolchain.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 mockserver contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ".config/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 mockserver contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "scripts/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 mockserver contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ".github/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 mockserver contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "Containerfile"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 mockserver contributors"
SPDX-License-Identifier = "MIT"

# Integration tests and config - MIT
[[annotations]]
path = ["tests/**", "pyproject.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 mockserver contributors"
SPDX-License-Identifier = "MIT"

# UV lock file - CC0-1.0 (machine-generated)
[[annotations]]
path = "uv.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 mockserver contributors"
SPDX-License-Identifier = "CC0-1.0"
